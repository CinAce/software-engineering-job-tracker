# Module 1 — one service. Containers and images, nothing else.
name: itc531m1
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args: ["PYTHON_TAG=3.12.11-slim-bookworm"]
    env_file: ["adapters/${ADAPTER:-local}.env"]
    environment:
      DATABASE_URL: sqlite:////data/app.db
      S3_ENDPOINT_URL: "http://unused:9000"
      S3_BUCKET: unused
    ports: ["${APP_PORT:-8000}:8000"]
    volumes: ["appdata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
volumes:
  appdata:
