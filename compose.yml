name: itc531-milestone2

services:
  broker:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USER:?set BROKER_USER in .env.local (see README)}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:?set BROKER_PASSWORD in .env.local (see README)}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env.local}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env.local}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
    ports:
      - "9000:9000"
    volumes:
      - "s3data:/data"
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:9000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args: ["PYTHON_TAG=3.12.11-slim-bookworm"]
    env_file:
      - "adapters/${ADAPTER:-local}.env"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL in .env.local}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?set S3_PUBLIC_ENDPOINT_URL in .env.local}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env.local}
      S3_REGION: ${S3_REGION:?set S3_REGION in .env.local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env.local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env.local}
      BROKER_URL: amqp://${BROKER_USER}:${BROKER_PASSWORD}@broker:5672/
    expose:
      - "8000"
    volumes:
      - "appdata:/data"
    depends_on:
      broker:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args: ["PYTHON_TAG=3.12.11-slim-bookworm"]
    command: ["python", "-m", "app.worker"]
    env_file:
      - "adapters/${ADAPTER:-local}.env"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      BROKER_URL: amqp://${BROKER_USER}:${BROKER_PASSWORD}@broker:5672/
    volumes:
      - "appdata:/data"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      disable: true

  notification-subscriber:
    build:
      context: .
      dockerfile: Dockerfile
      args: ["PYTHON_TAG=3.12.11-slim-bookworm"]
    command: ["python", "-m", "app.events.notification_subscriber"]
    env_file:
      - "adapters/${ADAPTER:-local}.env"
    environment:
      BROKER_URL: amqp://${BROKER_USER}:${BROKER_PASSWORD}@broker:5672/
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      disable: true

  analytics-subscriber:
    build:
      context: .
      dockerfile: Dockerfile
      args: ["PYTHON_TAG=3.12.11-slim-bookworm"]
    command: ["python", "-m", "app.events.analytics_subscriber"]
    env_file:
      - "adapters/${ADAPTER:-local}.env"
    environment:
      BROKER_URL: amqp://${BROKER_USER}:${BROKER_PASSWORD}@broker:5672/
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      disable: true

  gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  appdata:
  s3data: