server {
    listen 80;
    server_name localhost;

    # Allow requests to reach the application's 10 MiB validation.
    client_max_body_size 12m;

    # Define a JSON response for unrouted paths
    error_page 404 /404.json;
    location = /404.json {
        default_type application/json;
        return 404 '{"error": "not found"}';
    }

    # Gateway-owned health endpoint (does not touch the backend)
    location /health {
        default_type application/json;
        return 200 '{"status": "gateway healthy"}';
    }

    # Route for the API documentation UI
    location /docs {
        proxy_pass http://app:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route for the OpenAPI spec (required for /docs to populate)
    location /openapi.json {
        proxy_pass http://app:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Path-based routing for existing application endpoints
    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Object-storage file endpoints
    location /files {
        proxy_pass http://app:8000/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all to trigger the 404 JSON response
    location / {
        return 404;
    }
}
